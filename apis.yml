aid: craftview
name: Craftview
description: 'Craftview Software GmbH is a Frankfurt-headquartered European software
  group that builds ERP and project-management software for the skilled trades. Formed
  as a buy-and-build platform, Craftview operates a portfolio of long-established regional
  ERP brands — C''FLUIDE, ES2000, EXTRABAT, GILDE, KS21, MOSER, OSD, PLENION, RITA
  BOSSE and WINWORKER — serving green industries, construction-related trades, technical
  services and specialized crafts across Germany, Belgium, the Netherlands and France.
  The group reports 25,000+ active customers, 330+ employees and 11 locations across
  41 key European regions. Craftview publishes no public developer portal, API documentation
  or machine-readable API definitions; its software is sold and delivered per brand
  as on-premise and cloud ERP for trade businesses.'
